<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sokowyn</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="Sprites/player.png">
</head>
<body>
    <canvas id="bg-particles"></canvas>

    <div id="title-screen" class="screen active">
        <h1 class="game-title">Sokowyn</h1>
        <p class="start-text">click anywhere to start</p>
        <p class="warning">WARNING: play on PC only! This game doesn't support mobile controls, though there will be in the future.</p>        
    </div>

    <div id="pack-select-screen" class="screen">
        <h2 class="section-title">Select a Pack</h2>
        <div id="pack-list">
            </div>
    </div>

    <div id="level-list-screen" class="screen">
        <button class="back-button" id="back-to-packs">BACK</button>
        
        <div style="display: flex; flex-direction: column; align-items: center;">
            <h2 id="current-pack-title" class="section-title">Pack Name</h2>
            <div id="level-select-container">
                </div>
        </div>
    </div>

<div id="game-screen" class="screen">
    <button id="exit-game" class="back-button-top">BACK</button>
    <div id="move-counter-container" class="move-counter">MOVES: <span id="move-count">0</span></div>
    <div id="level-name-container">
        <h2 id="level-name-display">Level Name</h2> 
    </div>

    <canvas id="game-canvas" width="512" height="512"></canvas>
    
    <div id="action-icons-container">
        <img id="undo-icon" src="icons/undo.png" alt="Undo" class="action-icon disabled">
        <img id="reset-icon" src="icons/reset.png" alt="Reset" class="action-icon disabled">
        <img id="redo-icon" src="icons/redo.png" alt="Redo" class="action-icon disabled">
    </div>

    <div id="completion-card" style="display:none;">
        <h4>Level Complete!</h4>
        <p id="final-move-display" class="final-move-display">MOVES: 0</p>
        
        <div class="completion-buttons">
            <button id="back-to-levels" title="Level Select">
                <img src="icons/back.png" alt="Level Select">
            </button>
            <button id="next-level" title="Next Level">
                <img src="icons/next.png" alt="Next Level">
            </button>
        </div>
    </div>
        <audio id="game-music" loop></audio>   
        <canvas id="particle-canvas"></canvas> 
    </div>

    <button id="settings-toggle" onclick="toggleSettings()">
        <img src="icons/settings.png" alt="Settings">
    </button>
    
    <div id="settings-overlay" class="overlay-hidden">
    <div id="settings-window">
        <h3>SETTINGS</h3>
        <hr>
        <div class="setting-item">
            <label>MUSIC VOLUME</label>
            <input type="range" id="music-range" min="0" max="1" step="0.01" oninput="setMusicVolume(this.value)">
        </div>
        <div class="setting-item">
            <label>SFX VOLUME</label>
            <input type="range" id="sfx-range" min="0" max="1" step="0.01" oninput="setSFXVolume(this.value)">
        </div>
        <div class="setting-item" style="margin-top: 20px;">
            <button class="danger-button" onclick="clearAllProgress()">CLEAR ALL PROGRESS</button>
        </div>
        <button class="back-button" onclick="toggleSettings()" style="margin-top: 20px;">CLOSE</button>
    </div>
    </div>

    <script src="music.js"></script>  
    <script src="script.js"></script>
    <script src="game.js"></script> 
    <script src="particles.js"></script>           
</body>
</html>
